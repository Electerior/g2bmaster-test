name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # typecheck 를 build 와 따로 돌린다 — build 가 깨졌을 때
      # 타입 오류인지 번들링 오류인지 로그에서 바로 갈라 보이게 하려는 것.
      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
